[project]
name = "agent-eval-mcp"
version = "0.1.0"
description = "Measure what a coding agent actually did: tool efficiency, loops, test outcomes, gate violations and cost, from session transcripts. CLI and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Davidson" }]
keywords = ["mcp", "agent", "evals", "observability", "claude-code"]

dependencies = [
    "mcp>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.6",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=agent_eval --cov-report=term-missing --cov-fail-under=95"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
