# Dependency updates arrive on the calendar, not on your commit schedule.
#
# This exists because a scheduled scan found spring-web pinned seven patches
# behind the END of a line that was no longer maintained, and nothing had
# surfaced it. A weekly scan reports that state; this proposes the fix.
version: 2
updates:
  # "uv", not "pip". The pip ecosystem reads pyproject.toml and knows nothing
  # about uv.lock, so its PRs moved the specifiers and left the lock behind -
  # which CI then failed to notice. uv is the ecosystem that understands both
  # files; where it still updates only one of them, `uv sync --locked` in CI
  # turns that PR red instead of merging a lock that no longer matches.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # The actions in a workflow are dependencies too, and the least-watched ones.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
