name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # setup-uv's python-version sets UV_PYTHON, so `uv venv` below actually
      # builds against the matrix version. Installing with `--system` instead
      # would silently use the runner's own interpreter, which both defeats the
      # matrix and trips PEP 668 on Ubuntu.
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # The coverage floor lives in pyproject.toml, so it is the same number
      # locally and in CI. A gate that only exists in one place is a gate that
      # gets discovered late.
      - name: Test
        run: uv run pytest
