name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # v5 created the .venv and exported VIRTUAL_ENV; v7 sets UV_PYTHON and
      # creates nothing, so `uv pip install` fails with "No virtual environment
      # found" until one exists. The venv is explicit here rather than implied
      # by the action's version.
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # `uv sync`, not `uv pip install -e ".[dev]"`. The pip interface is
      # lock-unaware, so the old step never read uv.lock at all: the lock file
      # claimed a reproducibility this job did not have, and `ruff>=0.16.6`
      # floated - a ruff release could turn CI red on an unchanged tree.
      #
      # --frozen fails rather than silently re-resolving when the lock and
      # pyproject.toml disagree, which is the whole point of having a lock.
      # `uv sync` creates the environment itself, so the explicit `uv venv` that
      # setup-uv@v7 used to require is gone. Dependabot moves the lock.
      - name: Install from the lock
        run: uv sync --all-extras --frozen

      # Without an explicit bash shell, windows runners use pwsh, whose exit status is the LAST
      # command's - a failing `ruff check` would be a silent green on half the matrix.
      - name: Lint and format
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The coverage floor lives in pyproject.toml, so CI and local agree.
      - name: Test
        run: uv run pytest

  # This repo reads session transcripts, which are the most sensitive files on a
  # developer's machine. It had no dependency audit at all while its two sibling
  # repos each had one, which is the wrong repo to leave unwatched.
  #
  # The tree is small, so this runs on every push rather than weekly. --strict
  # fails when a dependency cannot be audited, because an audit that silently
  # skips what it cannot resolve is a gate that cannot fail.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      # The same lock as the test job, so what is audited is what is tested.
      # pip-audit itself is a tool rather than a dependency of the project, so it
      # is the one thing installed outside the lock.
      - name: Install from the lock
        run: uv sync --all-extras --frozen

      - name: Install pip-audit
        run: uv pip install pip-audit

      - name: Audit dependencies
        run: uv run pip-audit --strict
