name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # setup-uv creates the .venv and exports VIRTUAL_ENV, so do not add `uv venv`.
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The coverage floor lives in pyproject.toml, so CI and local agree.
      - name: Test
        run: uv run pytest
