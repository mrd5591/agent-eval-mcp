name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Passing python-version here makes setup-uv install that interpreter,
      # create the .venv and export VIRTUAL_ENV, so the steps below build
      # against the matrix version. Do not add an explicit `uv venv`: the
      # environment already exists and uv exits non-zero rather than reusing it.
      # Installing with `--system` instead would silently use the runner's own
      # interpreter, defeating the matrix and tripping PEP 668 on Ubuntu.
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e ".[dev]"

      # The coverage floor lives in pyproject.toml, so it is the same number
      # locally and in CI. A gate that only exists in one place is a gate that
      # gets discovered late.
      - name: Test
        run: uv run pytest
